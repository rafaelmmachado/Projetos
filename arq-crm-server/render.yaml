services:
  - type: web
    name: arq-crm
    runtime: node
    rootDir: arq-crm-server
    plan: free               # grátis: o CRM se "cutuca" sozinho pra não dormir
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI     # banco grátis (MongoDB Atlas): guarda leads e a sessão do WhatsApp
        sync: false
      - key: CRM_PASSWORD
        sync: false
